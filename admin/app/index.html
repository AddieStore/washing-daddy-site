<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#5409DA">
<title>WD Control</title>
<link rel="icon" type="image/png" href="/washer/favicon.png">
<link rel="apple-touch-icon" href="/washer/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="gate" class="gate" hidden><div class="gate-box" id="gateBox"></div></div>

<div id="app" class="app" hidden>
  <div id="demoBar" class="demo-bar" hidden>Demo mode: sample data in memory, nothing is saved or sent to the app.</div>
  <header class="hdr"><div class="hdr-in">
    <div class="logo" id="hLogo"></div>
    <div class="grow"><h1 id="hTitle">Services</h1><small id="hSub">Washing Daddy control</small></div>
    <div class="who" id="who"></div>
    <div class="status" id="status" role="status" aria-live="polite"><i></i><span>Live</span></div>
  </div></header>
  <main id="main"></main>
  <nav class="bar" id="bar" aria-label="Sections"></nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="dlg" id="dlg" hidden role="alertdialog"></div>
<div class="snack" id="snack" role="status" aria-live="polite"></div>

<script src="seed.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
