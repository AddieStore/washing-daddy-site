<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#5409DA">
<title>WD Daily Work</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Owner's daily work view: every washer's round for a chosen day, read live from the washes collection.
   Same Firebase project and sign-in as /admin/. Only the ADMINS numbers in the Firestore rules can read it. */
:root{--violet:#5409DA;--gold:#FFBA08;--ok:#0f9d6e;--red:#d23b4b;--sky:#2E8BFF;--orange:#FF6A1A;
  --bg:#FFF6E9;--card:#fff;--fg:#1A0A33;--fg2:#4b3f63;--fg3:#7d7391;--line:#eadfcd;--tile:#fbf3e6;--f:'Poppins',system-ui,sans-serif;--h:'Anton',Impact,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#120726;--card:#1d1036;--fg:#FFF6E9;--fg2:#d9cfe9;--fg3:#a497bd;--line:#33244f;--tile:#271846}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.top{background:var(--violet);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 14px;position:sticky;top:0;z-index:5}
.in{max-width:820px;margin:0 auto}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand h1{font-family:var(--h);font-weight:400;font-size:28px;margin:0;line-height:1}.brand h1 span{color:var(--gold)}
.brand a,.link{color:#fff;font-size:12px;font-weight:600;opacity:.85;background:none;border:0;text-decoration:underline;padding:0}
.days{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.days button,.days input{background:#ffffff22;border:0;border-radius:99px;color:#fff;padding:7px 14px;font-weight:600;font-size:13px}
.days button.on{background:var(--gold);color:#1A0A33}
.days input{color-scheme:dark}
main{max-width:820px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font-family:var(--h);font-weight:400;font-size:30px;line-height:1.1}
.tile span{font-size:12px;color:var(--fg2);font-weight:600}
.w{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.wh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wh h2{margin:0;font-size:18px}.wh small{color:var(--fg2);font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--tile);margin:10px 0 6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}.bar .d{background:var(--ok)}.bar .s{background:var(--red)}.bar .p{background:var(--gold)}
.meta{font-size:12px;color:var(--fg3);font-weight:500;display:flex;gap:12px;flex-wrap:wrap}
.car{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.car:first-of-type{margin-top:14px}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ch b{font-size:14px}.plate{font-family:var(--f);font-weight:600;font-size:12px;color:var(--fg2)}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.st-done{color:var(--ok)}.st-skipped{color:var(--red)}.st-washing,.st-arrived,.st-on_the_way{color:var(--orange)}.st-scheduled{color:var(--fg3)}
.times{font-size:12px;color:var(--fg2);margin:6px 0;display:flex;gap:12px;flex-wrap:wrap}
.tasks{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.t{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--tile);color:var(--fg3)}.t.y{background:var(--ok);color:#fff}
.note{font-size:12px;color:var(--fg2);background:var(--tile);border-radius:10px;padding:8px 10px;margin-top:6px}
.ph{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.ph figure{margin:0;flex:0 0 auto}
.ph img{display:block;height:96px;width:auto;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.ph figcaption{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--fg3);margin-top:3px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;color:var(--fg2)}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--violet)}
.gate .box{background:var(--bg);width:100%;max-width:400px;border-radius:26px;padding:26px 22px}
.gate h1{font-family:var(--h);font-weight:400;font-size:32px;margin:0 0 4px;color:var(--violet)}
.gate p{color:var(--fg2);font-size:14px;margin:6px 0 16px;font-weight:500}
.field{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:16px}
.ph2{display:flex;gap:8px}.cc{display:grid;place-items:center;font-weight:700;color:var(--fg2)}
.go{width:100%;margin-top:12px;background:var(--violet);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;font-weight:600}
.lb{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:20;padding:16px}.lb img{max-width:100%;max-height:100%;border-radius:12px}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="box" id="gateBox"></div></div>
<div id="app" hidden>
  <div class="top"><div class="in">
    <div class="brand"><h1>Daily <span>work</span></h1><span><a href="./">Approvals</a> · <button class="link" id="out">Sign out</button></span></div>
    <div class="days"><button data-d="0" class="on">Today</button><button data-d="-1">Yesterday</button><button data-d="-2">2 days ago</button><input type="date" id="pick" aria-label="Pick a day"></div>
  </div></div>
  <main id="main"></main>
</div>
<div class="lb" id="lb" hidden><img alt=""></div>
<script src="wd-sync.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const istDay = off => new Date(Date.now() + 5.5 * 3600e3 + off * 864e5).toISOString().slice(0, 10);
const hm = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit' }) : '' };
const nice = p => { const d = String(p || '').replace(/\D/g, '').slice(-10); return d ? '+91 ' + d.slice(0, 5) + ' ' + d.slice(5) : '' };
const STATUS = { scheduled: 'Waiting', on_the_way: 'On the way', arrived: 'Arrived', washing: 'Washing', done: 'Done', skipped: 'Skipped' };
let db = null, day = istDay(0), rows = [], locs = {}, unsubs = [];

/* sign in (same flow as /admin/) */
function gatePhone(msg) {
  $('#gateBox').innerHTML = `<h1>Daily work</h1><p>Owner sign-in. We'll text a 6-digit code.</p>
   <div class="ph2"><span class="cc">+91</span><input class="field" id="gPh" inputmode="numeric" maxlength="11" placeholder="98765 43210" aria-label="Mobile number"></div>
   <div class="err" id="gErr">${esc(msg || '')}</div><button class="go" id="gGo">Send code</button>`;
  const ph = $('#gPh'); ph.focus(); ph.onkeydown = e => { if (e.key === 'Enter') $('#gGo').click() };
  $('#gGo').onclick = async () => {
    const d = ph.value.replace(/\D/g, '').slice(-10);
    if (!/^[6-9]\d{9}$/.test(d)) { $('#gErr').textContent = 'Enter a 10-digit mobile number.'; return }
    const b = $('#gGo'); b.disabled = true; b.textContent = 'Sending…';
    try { await WDAuth.send(d); gateCode(d) } catch (e) { b.disabled = false; b.textContent = 'Send code'; $('#gErr').textContent = e.en || "Couldn't sign in." }
  };
}
function gateCode(d) {
  $('#gateBox').innerHTML = `<h1>Enter code</h1><p>Sent to ${nice(d)}.</p><input class="field" id="gOtp" inputmode="numeric" maxlength="6" placeholder="••••••" aria-label="6-digit code"><div class="err" id="gErr"></div><button class="go" id="gOk">Sign in</button>`;
  const o = $('#gOtp'); o.focus(); o.oninput = () => { o.value = o.value.replace(/\D/g, '').slice(0, 6); if (o.value.length === 6) $('#gOk').click() };
  $('#gOk').onclick = async () => { const b = $('#gOk'); if (b.disabled) return; b.disabled = true;
    try { await WDAuth.confirm(o.value); start(WDAuth.user()) } catch (e) { b.disabled = false; $('#gErr').textContent = e.en || 'Wrong code.'; o.value = ''; o.focus() } };
}

/* data */
function stop() { unsubs.forEach(u => { try { u() } catch (e) {} }); unsubs = [] }
async function start(u) {
  stop();
  if (!u) { $('#app').hidden = true; $('#gate').hidden = false; gatePhone(); return }
  db = db || await window.claude.use('db');
  listen();
}
function listen() {
  stop();
  let first = true;
  unsubs.push(db.collection('washes').where('date', '==', day).onSnapshot(sn => {
    rows = sn.docs.map(d => d.data()).filter(Boolean);
    if (first) { first = false; $('#gate').hidden = true; $('#app').hidden = false }
    render();
  }, e => { stop(); WDAuth.signOut(); $('#app').hidden = true; $('#gate').hidden = false;
    gatePhone(e.code === 'invalid_argument' ? 'This number is not the owner number.' : "Couldn't load. Check the internet and sign in again.") }));
  unsubs.push(db.collection('locations').onSnapshot(sn => { locs = {}; sn.docs.forEach(d => locs[d.id] = d.data()); render() }, () => {}));
}

/* view */
const photo = p => p && (p.url || (p.asset_id ? '/_blob/' + p.asset_id : ''));
function carHtml(w) {
  const tasks = Array.isArray(w.tasks) ? w.tasks : [], photos = (Array.isArray(w.photos) ? w.photos : []).filter(photo);
  return `<div class="car"><div class="ch"><div><b>${esc(w.car_label || w.reg)}</b> <span class="plate">${esc(w.reg)}</span></div><span class="pill st-${esc(w.status)}">${STATUS[w.status] || esc(w.status)}</span></div>
  <div class="times">${w.status === 'skipped' ? '' : `<span>Started ${hm(w.started_at) || '–'}</span><span>Finished ${hm(w.finished_at) || '–'}</span>`}${w.minutes != null ? `<span>${w.minutes} min</span>` : ''}${w.water_litres ? `<span>${w.water_litres} L water</span>` : ''}</div>
  ${w.status === 'skipped' ? `<div class="note">Skipped: ${esc(w.skip_reason || 'no reason given')}</div>` : ''}
  ${tasks.length ? `<div class="tasks">${tasks.map(t => `<span class="t ${t.done ? 'y' : ''}">${t.done ? '✓ ' : ''}${esc(t.label || t.key)}</span>`).join('')}</div>` : ''}
  ${w.washer_note ? `<div class="note">Washer's note: ${esc(w.washer_note)}</div>` : ''}
  ${photos.length ? `<div class="ph">${photos.map(p => `<figure><img src="${esc(photo(p))}" alt="${esc(p.kind)} photo" loading="lazy"><figcaption>${esc(p.kind)} ${hm(p.at)}</figcaption></figure>`).join('')}</div>` : ''}</div>`;
}
function render() {
  const by = {};
  rows.forEach(w => { const id = w.washer_id || (w.washer && w.washer.id) || '?'; (by[id] = by[id] || { name: (w.washer && w.washer.name) || id, list: [] }).list.push(w) });
  const all = rows, done = all.filter(w => w.status === 'done').length, skip = all.filter(w => w.status === 'skipped').length;
  const ph = all.reduce((a, w) => a + (Array.isArray(w.photos) ? w.photos.length : 0), 0), mins = all.filter(w => w.minutes != null);
  const label = day === istDay(0) ? 'today' : day;
  let h = `<div class="tiles"><div class="tile"><b>${done}/${all.length}</b><span>Cars done</span></div><div class="tile"><b>${skip}</b><span>Skipped</span></div><div class="tile"><b>${ph}</b><span>Photos</span></div><div class="tile"><b>${mins.length ? Math.round(mins.reduce((a, w) => a + w.minutes, 0) / mins.length) : '–'}</b><span>Avg minutes a car</span></div></div>`;
  if (!all.length) h += `<div class="empty"><b>No work logged ${esc(label)}.</b><br>A washer's round shows up here once they swipe "Round shuru karo" in the washer app.</div>`;
  Object.entries(by).forEach(([id, g]) => {
    g.list.sort((a, b) => (a.seq || 99) - (b.seq || 99));
    const n = g.list.length, d = g.list.filter(w => w.status === 'done').length, s = g.list.filter(w => w.status === 'skipped').length, p = n - d - s;
    const times = g.list.map(w => w.started_at).filter(Boolean).sort(), ends = g.list.map(w => w.finished_at).filter(Boolean).sort();
    const loc = locs[id], live = loc && day === istDay(0) ? `<a style="color:var(--violet)" href="https://maps.google.com/?q=${loc.lat},${loc.lng}" target="_blank" rel="noopener">Live location · ${hm(loc.updated_at)}</a>` : '';
    h += `<section class="w"><div class="wh"><h2>${esc(g.name)}</h2><small>${d} of ${n} cars</small></div>
     <div class="bar"><i class="d" style="width:${d / n * 100}%"></i><i class="s" style="width:${s / n * 100}%"></i><i class="p" style="width:${p / n * 100}%"></i></div>
     <div class="meta"><span>Round: ${esc(id)}</span>${times.length ? `<span>First car ${hm(times[0])}</span>` : ''}${ends.length ? `<span>Last finished ${hm(ends[ends.length - 1])}</span>` : ''}${live}</div>
     ${g.list.map(carHtml).join('')}</section>`;
  });
  $('#main').innerHTML = h;
}

$$('.days button').forEach(b => b.onclick = () => { day = istDay(+b.dataset.d); $('#pick').value = ''; $$('.days button').forEach(x => x.classList.toggle('on', x === b)); listen() });
$('#pick').onchange = e => { if (!e.target.value) return; day = e.target.value; $$('.days button').forEach(x => x.classList.remove('on')); listen() };
$('#out').onclick = async () => { stop(); await WDAuth.signOut(); start(null) };
$('#main').onclick = e => { if (e.target.matches('.ph img')) { $('#lb img').src = e.target.src; $('#lb').hidden = false } };
$('#lb').onclick = () => $('#lb').hidden = true;
WDAuth.ready().then(start);
</script>
</body>
</html>
