<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5409DA">
<title>My account · Washing Daddy</title>
<meta name="description" content="Sign in to see today's wash, who washed your car, your plan and your bills.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/customer/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Poppins:wght@400;500;600;700;800&display=swap">
<!-- Firebase phone sign-in and the live database, the same ones the customer app uses -->
<script src="/customer/wd-sync.js"></script>
<style>
:root{
  --violet:#5409DA; --violet-deep:#4207B5; --violet-ink:#2A0478;
  --gold:#FFBA08; --cream:#FFF6E9; --ink:#1A0A33;
  --orange:#FF6A1A; --sky:#2E8BFF; --ok:#14A06F; --bad:#D03B3B;
  --muted:rgba(26,10,51,.6); --line:rgba(26,10,51,.12);
  --shout:'Anton','Impact','Arial Narrow',sans-serif;
  --slab:'Alfa Slab One','Rockwell','Georgia',serif;
  --body:'Poppins','Helvetica Neue',Arial,sans-serif;
  --card-shadow:0 14px 34px rgba(26,10,51,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0; background:var(--violet); color:var(--cream); font-family:var(--body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle, rgba(255,246,233,.09) 1.3px, transparent 1.6px); background-size:18px 18px}
.wrap{max-width:1200px; margin:0 auto; padding-inline:24px}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
img{max-width:100%; display:block}
button,input,select,textarea{font-family:inherit; font-size:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--gold); outline-offset:3px}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; border:0;
  font-weight:800; font-size:15px; padding:13px 24px; border-radius:999px; text-decoration:none;
  background:var(--gold); color:var(--ink); transition:transform .12s ease, box-shadow .12s ease, opacity .12s}
.btn:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(26,10,51,.2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5; cursor:default; transform:none; box-shadow:none}
.btn.violet{background:var(--violet); color:var(--cream)}
.btn.ink{background:var(--ink); color:var(--gold)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.btn.light{background:rgba(255,246,233,.14); color:var(--cream)}
.btn.sm{padding:9px 16px; font-size:14px}
.btn.wide{width:100%}
.link{background:none; border:0; padding:0; color:var(--violet); font-weight:700; cursor:pointer; text-decoration:underline; text-underline-offset:3px}

/* ---------- header ---------- */
.top{position:sticky; top:0; z-index:40; border-bottom:10px solid var(--gold);
  background:radial-gradient(circle, rgba(255,246,233,.13) 1.4px, transparent 1.6px) 0 0/14px 14px, var(--violet)}
.top .wrap{display:flex; align-items:center; gap:24px; padding-block:10px}
.top .logo{width:150px; transform:rotate(-4deg); filter:drop-shadow(3px 3px 0 var(--violet-ink))}
.top nav{display:flex; gap:4px; margin-left:auto}
.top nav a{font-family:var(--shout); font-size:19px; letter-spacing:.04em; text-transform:uppercase; text-decoration:none;
  padding:6px 14px; border-radius:999px; color:var(--cream)}
.top nav a:hover{background:rgba(255,246,233,.14)}
.top nav a.on{background:var(--cream); color:var(--violet)}
.who{display:flex; align-items:center; gap:10px}
.who .av{width:38px; height:38px; border-radius:50%; background:var(--gold); color:var(--ink); display:grid; place-items:center;
  font-family:var(--shout); font-size:18px}
.who .nm{font-weight:700; font-size:14px; line-height:1.2}
.who .nm small{display:block; font-weight:500; opacity:.75}
@media(max-width:860px){ .top nav{display:none} .who{margin-left:auto} .who .nm{display:none} }

/* ---------- sign-in ---------- */
.signin .wrap{display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:center; padding-block:64px 80px}
.hl h1{font-family:var(--shout); font-weight:400; font-size:clamp(56px,8vw,120px); line-height:.9; text-transform:uppercase; color:var(--cream); margin:0 0 20px}
.hl h1 .strike{position:relative; display:inline-block; color:rgba(255,246,233,.55)}
.hl h1 .strike::after{content:""; position:absolute; left:-2%; right:-2%; top:52%; height:.11em; background:var(--gold); transform:rotate(-3deg)}
.hl h1 em{font-style:normal; color:var(--gold); display:block; text-shadow:5px 5px 0 var(--ink)}
.hl .lede{font-size:19px; font-weight:500; max-width:27em}
.hl .row{display:flex; gap:26px; align-items:center; margin-top:34px}
.photo{position:relative; width:210px; flex:none; transform:rotate(3deg); border:8px solid var(--cream); border-radius:22px; background:var(--cream);
  box-shadow:0 18px 40px rgba(18,7,36,.45)}
.photo img{border-radius:14px; width:100%; height:auto}
.photo .tag{position:absolute; right:-16px; bottom:-18px; transform:rotate(-6deg); background:var(--gold); color:var(--ink); border-radius:16px;
  padding:8px 14px; font-weight:700; font-size:13px; line-height:1.05; text-align:center; box-shadow:0 8px 20px rgba(18,7,36,.35)}
.photo .tag b{display:block; font-family:var(--shout); font-weight:400; font-size:30px; line-height:1}
.perks{list-style:none; padding:0; margin:0; display:grid; gap:10px; font-weight:600}
.perks li{display:flex; gap:10px; align-items:center}
.perks li::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--gold); flex:none}
.authcard{background:#fff; color:var(--ink); border-radius:32px; padding:36px; box-shadow:0 30px 60px rgba(18,7,36,.35)}
.authcard h2{font-family:var(--shout); font-weight:400; font-size:38px; line-height:1; text-transform:uppercase}
.authcard p.sub{color:var(--muted); margin:10px 0 22px; font-weight:500}
.lbl{display:block; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; margin:16px 0 6px; color:var(--ink)}
.field{width:100%; padding:13px 16px; border-radius:14px; border:2px solid var(--line); background:#fff; color:var(--ink); font-weight:600; outline:none}
.field:focus{border-color:var(--violet)}
.phone{display:flex; border:2px solid var(--line); border-radius:14px; overflow:hidden}
.phone:focus-within{border-color:var(--violet)}
.phone .cc{padding:13px 14px; background:var(--cream); font-weight:800}
.phone input{flex:1; min-width:0; border:0; padding:13px 14px; font-weight:700; font-size:18px; letter-spacing:.04em; outline:none}
.otp{display:flex; gap:10px}
.otp input{width:52px; height:60px; text-align:center; font-size:26px; font-weight:800; border:2px solid var(--line); border-radius:14px; outline:none}
.otp input:focus{border-color:var(--violet)}
.otp.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.err{color:var(--bad); font-weight:700; font-size:14px; min-height:20px; margin-top:8px}
.hint{font-size:14px; color:var(--muted); margin-top:16px}
.hint b{color:var(--ink)}
.picks{display:flex; flex-wrap:wrap; gap:8px}
.picks button{border:2px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:8px 14px; font-weight:700; font-size:14px; cursor:pointer}
.picks button.on{background:var(--ink); color:var(--gold); border-color:var(--ink)}
.authcard .btn{margin-top:20px}
@media(max-width:940px){ .signin .wrap{grid-template-columns:1fr; gap:36px; padding-block:40px 60px} }
@media(max-width:560px){ .hl .row{flex-direction:column; align-items:flex-start} .authcard{padding:26px 22px} .otp input{width:44px; height:54px} }

/* ---------- dashboard ---------- */
.band .wrap{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:24px; padding-block:44px 34px}
.band h1{font-family:var(--shout); font-weight:400; font-size:clamp(46px,6vw,84px); line-height:.92; text-transform:uppercase}
.band h1 em{font-style:normal; color:var(--gold)}
.band .meta{margin-top:10px; font-weight:600; opacity:.85}
.band .acts{display:flex; flex-wrap:wrap; gap:10px}
.cars{display:flex; flex-wrap:wrap; gap:6px; padding:5px; background:rgba(26,10,51,.25); border-radius:999px; width:max-content; max-width:100%; margin-top:20px}
.cars button{border:0; background:none; color:var(--cream); font-family:var(--shout); font-size:18px; letter-spacing:.04em; text-transform:uppercase; padding:9px 20px; border-radius:999px; cursor:pointer}
.cars button.on{background:var(--gold); color:var(--ink)}
.board{background:var(--cream); color:var(--ink); padding-block:44px 80px}
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:24px}
.card{background:#fff; border-radius:28px; padding:28px; box-shadow:var(--card-shadow); min-width:0}
.s8{grid-column:span 8} .s4{grid-column:span 4} .s6{grid-column:span 6} .s12{grid-column:span 12}
@media(max-width:1020px){ .s8,.s4,.s6{grid-column:span 12} }
.kick{display:inline-block; background:var(--ink); color:var(--gold); font-weight:800; font-size:12px; letter-spacing:.1em; text-transform:uppercase; padding:4px 12px; border-radius:999px}
.card h2{font-family:var(--shout); font-weight:400; font-size:34px; line-height:1; text-transform:uppercase; margin-top:12px}
.card h2 b{font-weight:400; color:var(--violet)}
.card .sub{color:var(--muted); font-weight:500; margin-top:6px}
.chead{display:flex; justify-content:space-between; align-items:flex-start; gap:16px}

/* today */
.live{display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:13px; color:var(--ok)}
.live i{width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 rgba(20,160,111,.5); animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(20,160,111,0)}100%{box-shadow:0 0 0 0 rgba(20,160,111,0)}}
.stepper{display:grid; grid-template-columns:repeat(5,1fr); margin:28px 0 8px; position:relative}
.stepper .st{text-align:center; position:relative; font-weight:700; font-size:13px; color:var(--muted)}
.stepper .st::before{content:""; position:absolute; top:15px; left:-50%; right:50%; height:4px; background:var(--line); z-index:0}
.stepper .st:first-child::before{display:none}
.stepper .st.done::before,.stepper .st.now::before{background:var(--violet)}
.stepper .dot{position:relative; z-index:1; width:34px; height:34px; border-radius:50%; margin:0 auto 8px; display:grid; place-items:center; background:#fff; box-shadow:inset 0 0 0 3px var(--line); color:#fff}
.stepper .st.done .dot{background:var(--violet); box-shadow:none}
.stepper .st.now .dot{background:var(--gold); box-shadow:0 0 0 6px rgba(255,186,8,.3)}
.stepper .st.done,.stepper .st.now{color:var(--ink)}
.stepper .t{display:block; font-weight:600; font-size:12px; color:var(--muted)}
.today{display:grid; grid-template-columns:1.1fr .9fr; gap:26px; margin-top:22px}
@media(max-width:700px){ .today{grid-template-columns:1fr} .stepper .st{font-size:11px} }
.washer{display:flex; align-items:center; gap:14px; padding:16px; border-radius:20px; background:var(--cream)}
.washer .av{width:54px; height:54px; border-radius:18px; background:var(--violet); color:var(--gold); display:grid; place-items:center; font-family:var(--shout); font-size:26px; flex:none; overflow:hidden}
.washer .av img{width:100%; height:100%; object-fit:cover}
.washer b{display:block; font-size:17px}
.washer small{color:var(--muted); font-weight:600}
.tasks{list-style:none; padding:0; margin:16px 0 0}
.tasks li{display:flex; align-items:center; gap:12px; padding:10px 0; border-top:2px dashed var(--line); font-weight:600}
.tasks li .ck{width:24px; height:24px; border-radius:8px; display:grid; place-items:center; flex:none; box-shadow:inset 0 0 0 2px var(--line)}
.tasks li.ok .ck{background:var(--ok); box-shadow:none; color:#fff}
.tasks li .at{margin-left:auto; color:var(--muted); font-size:13px}
.shots{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.shots figure{margin:0; position:relative}
.shots img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:16px; background:var(--cream)}
.shots figcaption{position:absolute; left:10px; top:10px; background:var(--ink); color:var(--gold); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 10px; border-radius:999px}
.noshot{display:grid; place-items:center; text-align:center; aspect-ratio:4/3; border-radius:16px; background:var(--cream); color:var(--muted); font-weight:600; padding:20px; grid-column:span 2}
.note{margin-top:14px; padding:14px 16px; border-radius:16px; background:rgba(255,186,8,.18); font-weight:600}
.note small{display:block; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.stars{display:flex; gap:6px; margin-top:14px; align-items:center}
.stars button{border:0; background:none; cursor:pointer; font-size:26px; line-height:1; color:var(--line); padding:0}
.stars button.on{color:var(--gold)}
.facts{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
.facts span{background:var(--cream); border-radius:999px; padding:6px 14px; font-weight:700; font-size:13px}

/* plan */
.plan{background:var(--violet); color:var(--cream)}
.plan .kick{background:var(--gold); color:var(--ink)}
.plan h2{color:var(--cream)}
.plan .price{font-family:var(--slab); font-size:40px; line-height:1; color:var(--gold); margin-top:10px}
.plan .price small{font-family:var(--body); font-size:14px; font-weight:700; color:rgba(255,246,233,.7)}
.meter{margin:22px 0 6px; height:12px; border-radius:999px; background:rgba(255,246,233,.2); overflow:hidden}
.meter i{display:block; height:100%; background:var(--gold); border-radius:999px; transition:width .8s ease}
.plan .till{display:flex; justify-content:space-between; font-weight:700; font-size:14px}
.plan .due{margin-top:18px; padding:14px 16px; border-radius:18px; background:rgba(26,10,51,.28); font-weight:600}
.plan .due b{color:var(--gold)}
.plan ul{list-style:none; padding:0; margin:18px 0 0}
.plan li{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:2px dashed rgba(255,246,233,.25); font-size:14px; font-weight:600}
.plan li span:last-child{color:var(--gold); font-weight:800; text-align:right}
.plan .btns{display:grid; gap:10px; margin-top:22px}

/* week */
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-top:22px}
.day{border-radius:18px; background:var(--cream); padding:14px 12px; min-height:150px; display:flex; flex-direction:column; gap:6px}
.day.today{background:var(--violet); color:var(--cream)}
.day.off{opacity:.55}
.day .dn{font-family:var(--shout); font-size:20px; text-transform:uppercase; letter-spacing:.03em; line-height:1}
.day .dd{font-size:12px; font-weight:700; opacity:.7}
.day .x{font-size:12px; font-weight:700; padding:3px 8px; border-radius:999px; background:#fff; color:var(--ink); width:max-content; max-width:100%}
.day.today .x{background:var(--gold)}
.day .x.base{background:transparent; padding:0; color:inherit; opacity:.8}
@media(max-width:820px){ .week{grid-template-columns:repeat(4,1fr)} }
@media(max-width:520px){ .week{grid-template-columns:repeat(2,1fr)} }

/* actions */
.acts-list{display:grid; gap:10px; margin-top:20px}
.act{display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:0; cursor:pointer; padding:14px 16px; border-radius:18px; background:var(--cream); color:var(--ink); text-decoration:none; transition:transform .12s, background .12s}
.act:hover{transform:translateX(4px); background:#FFEBC8}
.act .ic{width:42px; height:42px; border-radius:14px; background:var(--violet); color:var(--gold); display:grid; place-items:center; flex:none}
.act b{display:block; font-size:15px}
.act small{display:block; color:var(--muted); font-weight:600; font-size:13px; line-height:1.3}
.act.lock{opacity:.6}

/* history */
table{width:100%; border-collapse:collapse; margin-top:18px; font-size:14px}
th{text-align:left; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:800; padding:8px 10px}
td{padding:12px 10px; border-top:2px dashed var(--line); font-weight:600; vertical-align:top}
td .pill,.pill{display:inline-block; font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px; background:var(--cream); white-space:nowrap}
.pill.ok{background:rgba(20,160,111,.14); color:var(--ok)}
.pill.skip{background:rgba(26,10,51,.08); color:var(--muted)}
.pill.go{background:rgba(255,186,8,.25); color:var(--ink)}
.tablewrap{overflow-x:auto}
.empty{padding:26px; text-align:center; color:var(--muted); font-weight:600; background:var(--cream); border-radius:18px; margin-top:18px}

/* usage */
.bars{display:grid; gap:14px; margin-top:20px}
.bar .bt{display:flex; justify-content:space-between; font-weight:700; font-size:14px}
.bar .bt span:last-child{color:var(--muted)}
.bar .tr{height:10px; border-radius:999px; background:var(--cream); margin-top:6px; overflow:hidden}
.bar .tr i{display:block; height:100%; border-radius:999px; background:var(--violet)}
.big{font-family:var(--slab); font-size:56px; line-height:1; color:var(--violet); margin-top:16px}
.big small{font-family:var(--body); font-size:15px; font-weight:700; color:var(--muted)}

/* details */
dl{display:grid; grid-template-columns:auto 1fr; gap:10px 20px; margin:18px 0 0}
dt{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:800; padding-top:2px}
dd{margin:0; font-weight:600}
.carpic{width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:20px; background:var(--cream); margin-top:18px}
.plate{display:inline-block; font-family:var(--shout); letter-spacing:.08em; font-size:18px; background:var(--gold); color:var(--ink); padding:2px 12px; border-radius:8px}

/* plans compare */
.compare{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:24px}
@media(max-width:1020px){ .compare{grid-template-columns:repeat(2,1fr)} }
@media(max-width:560px){ .compare{grid-template-columns:1fr} }
.pc{position:relative; display:flex; flex-direction:column; border-radius:24px; padding:22px; background:var(--cream)}
.pc.cur{background:var(--violet); color:var(--cream)}
.pc h3{font-family:var(--shout); font-weight:400; font-size:24px; text-transform:uppercase; letter-spacing:.02em}
.pc .pr{font-family:var(--slab); font-size:32px; color:var(--violet); margin:6px 0 12px}
.pc.cur .pr{color:var(--gold)}
.pc .pr small{font-family:var(--body); font-size:13px; font-weight:700; opacity:.6}
.pc ul{list-style:none; padding:0; margin:0 0 18px}
.pc li{display:flex; justify-content:space-between; gap:8px; padding:7px 0; border-top:2px dashed var(--line); font-size:13.5px; font-weight:600}
.pc.cur li{border-top-color:rgba(255,246,233,.25)}
.pc li .q{font-weight:800}
.pc .btn{margin-top:auto}
.pc .flag{position:absolute; top:-12px; right:14px; background:var(--orange); color:var(--cream); font-family:var(--shout); font-size:14px; padding:2px 12px; border-radius:999px; letter-spacing:.06em; text-transform:uppercase}

/* banner */
.banner{grid-column:span 12; display:flex; gap:16px; align-items:center; padding:18px 22px; border-radius:22px; background:var(--gold); color:var(--ink); font-weight:700}
.banner.soft{background:#fff; box-shadow:var(--card-shadow)}

/* ---------- modal ---------- */
.scrim{position:fixed; inset:0; z-index:80; background:rgba(26,10,51,.55); display:grid; place-items:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.on{opacity:1; pointer-events:auto}
.modal{width:min(520px,100%); max-height:calc(100vh - 40px); overflow:auto; background:#fff; color:var(--ink); border-radius:28px; padding:30px; position:relative;
  transform:translateY(16px) scale(.98); transition:transform .25s ease; box-shadow:0 40px 80px rgba(18,7,36,.4)}
.scrim.on .modal{transform:none}
.modal h3{font-family:var(--shout); font-weight:400; font-size:32px; line-height:1; text-transform:uppercase; padding-right:40px}
.modal .sub{color:var(--muted); font-weight:500; margin-top:8px}
.modal .x{position:absolute; top:18px; right:18px; width:38px; height:38px; border-radius:50%; border:0; background:var(--cream); cursor:pointer; font-size:20px; line-height:1}
.opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 16px; border-radius:18px; border:2px solid var(--line); background:#fff; cursor:pointer; margin-top:10px; color:var(--ink)}
.opt.on{border-color:var(--violet); background:rgba(84,9,218,.05)}
.opt .rd{width:20px; height:20px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--line); flex:none}
.opt.on .rd{box-shadow:inset 0 0 0 6px var(--violet)}

/* ---------- the wash schedule, same rules as the app ---------- */
function weekPlan(c){const f=planOf(c).f,h=hash(regOf(c)),w={};DAYS.forEach(d=>w[d]=[]);
  const spread=(k,n,off)=>{if(n>=7){DAYS.forEach(d=>w[d].push(k));return}for(let i=0;i<n;i++)w[DAYS[(off+Math.floor(i*7/n))%7]].push(k)};
  spread('foam',f.foam,h%7);spread('int',f.int,(h>>>3)%7);spread('tyre',f.tyre,(h>>>6)%7);
  if(f.det>=16)spread('det',4,(h>>>9)%7);
  return w}
function detDays(c){const f=planOf(c).f;if(!f.det||f.det>=16)return [];const d=((hash(regOf(c))>>>9)%28),gap=Math.floor(28/f.det);return Array.from({length:f.det},(_,i)=>(d+i*gap)%28+1)}
const dayKey=d=>DAYS[(d.getDay()+6)%7];
function extras(c,dt){const k=[...weekPlan(c)[dayKey(dt)]];if(detDays(c).includes(dt.getDate()))k.push('det');return k}
const planTasks=(c,d)=>['pressure',...extras(c,d).map(k=>KEYMAP[k]),'dry'];

/* ---------- state ---------- */
let ME=null;            // {phone10}
let ACCT=null;          // the account, shaped like the app's

let DB=null;
const WASHES={}, REQS={}, BILL={}, PHOTOS={};
let ONDEMAND=[];
let unsubs=[], acctUnsub=null, authStep={step:'phone',phone:'',signup:{name:'',area:'',model:'',plate:'',plan:'pro'}};

const car=()=>ACCT.cars[Math.min(carIdx,ACCT.cars.length-1)];
const pausedOf=c=>{const p=(local.paused||{})[ACCT.phone+'_'+regOf(c)];return p&&p.to>=iso(TODAY)?p:null};
async function realDb(){if(!DB){try{DB=await (window.claude&&window.claude.use?window.claude.use('db'):null)}catch(e){DB=null}}return DB}

function fromCustomerDoc(r){
  const area=r.area||'';
  return {name:r.name||'',phone:String(r.phone||'').slice(-10),since:r.since||'',area,status:r.status||'new',

    requested:(r.requested_cars||[])}}
function fromContract(r){r=r||{};const w=r.washer||{};return {date:r.date,reg:r.reg,washer:{name:String(w.name||''),photo_url:safeImg(w.photo_url)},
  status:STAGES.includes(r.status)||r.status==='skipped'?r.status:'scheduled',eta:hm(r.eta),on_the_way_at:hm(r.on_the_way_at),arrived_at:hm(r.arrived_at),started_at:hm(r.started_at),finished_at:hm(r.finished_at),
  minutes:numOrNull(r.minutes??(r.started_at&&r.finished_at?t2m(hm(r.finished_at))-t2m(hm(r.started_at)):null)),
  tasks:(Array.isArray(r.tasks)?r.tasks:[]).map(t=>({key:String(t.key),label:TASK_LABEL[t.key]||String(t.label||t.key),done:!!t.done,done_at:hm(t.done_at)})),
  photos:(Array.isArray(r.photos)?r.photos:[]).map(p=>({kind:String(p.kind||''),src:safeImg(p.asset_id?'/_blob/'+p.asset_id:p.url)})).filter(p=>p.src),
  water_litres:numOrNull(r.water_litres),washer_note:String(r.washer_note||''),skip_reason:String(r.skip_reason||'')}}

/* ---------- sample account for the preview ---------- */

function sampleWashes(c){
  const out=[],h=hash(regOf(c));
  for(let i=0;i<34;i++){const d=addDays(TODAY,-i),k=planTasks(c,d);
    if(i>0&&(h+i)%13===0){out.push({date:iso(d),reg:regOf(c),washer:{name:c.washer},status:'skipped',skip_reason:'Car was not in its spot',tasks:[],photos:[]});continue}
    const fin=t2m('06:20')+((h>>>i%9)%28),mins=9+((h+i)%5),start=fin-mins;
    const doc={date:iso(d),reg:regOf(c),washer:{name:c.washer},status:'done',eta:m2t(start+2),on_the_way_at:m2t(start-9),arrived_at:m2t(start-1),started_at:m2t(start),finished_at:m2t(fin),minutes:mins,
      tasks:k.map((t,j)=>({key:t,label:TASK_LABEL[t],done:true,done_at:m2t(start+Math.round(mins*(j+1)/k.length))})),photos:[],water_litres:7,washer_note:''};
    if(i===0&&c.id==='c1'){Object.assign(doc,{status:'washing',finished_at:null,minutes:null,photos:[{kind:'before',src:'/img/before.webp'}],washer_note:'Neem leaves on the roof, cleaning them off now.'});

/* ---------- API: the same calls the app makes ---------- */
const API={
  async sendOtp(p){if(REAL)return window.WDAuth.send(p);await wait(600);return {ok:true}},
  async confirm(code){if(REAL)return window.WDAuth.confirm(code);await wait(600);if(code!=='1234'){const e=new Error('That code is wrong. In this preview the code is 1234.');throw e}return {uid:'demo'}},
  async signup(s){
    if(!REAL){await wait(700);return {ok:true}}
    const db=await realDb();if(!db)return {ok:false};
    const c={id:'c0',name:s.model,make:'',plate:s.plate,plan:s.plan,washer:WASHER_FOR(s.area),parking:s.area+', parking spot to be confirmed',window:'Before 7:30 AM',keys:"I'll unlock it"};
    try{await db.doc('customers/'+window.WDAuth.phone()).set({phone:window.WDAuth.phone(),name:s.name,area:s.area,status:'new',cars:[c],regs:[regOf(c)],since:fmt(TODAY,{month:'long',year:'numeric'}),created_at:nowIST(),updated_at:nowIST()});return {ok:true}}
    catch(e){console.warn(e);return {ok:false}}},
  async request(body){
    if(!REAL){await wait(500);return {ok:true}}
    const db=await realDb();if(!db)return {ok:false};
    try{const w=db.collection('requests').doc().set({...body,created_at:nowIST(),status:'open'});
      return await Promise.race([w.then(()=>({ok:true})),wait(5000).then(()=>({ok:true}))])}
    catch(e){console.warn(e);return {ok:false}}},
  async rate(c,stars){if(!REAL)return {ok:true};const db=await realDb();if(!db)return {ok:false};
    try{await db.doc(`ratings/${iso(TODAY)}_${regOf(c)}`).set({reg:regOf(c),date:iso(TODAY),stars,at:nowIST()});return {ok:true}}catch(e){return {ok:false}}},
  async addCar(x){if(!REAL){await wait(600);return {ok:true}}
    const db=await realDb();if(!db)return {ok:false};
    try{const ref=db.doc('customers/'+window.WDAuth.phone()),g=await ref.get(),cur=(g.exists&&g.data().requested_cars)||[];
      await ref.update({requested_cars:cur.concat([{...x,at:nowIST()}]).slice(-5),updated_at:nowIST()});return {ok:true}}
    catch(e){console.warn(e);return {ok:false}}},
  // what the book says this car owes and is paid up to (n8n workflow 8, wd-pay-lookup)
  async bill(c){
    if(!REAL){const p=planOf(c);return {found:true,fee:p.price,owes:0,due:p.price,paidTo:c.till,status:'Active'}}
    try{const r=await fetch(N8N+'/wd-pay-lookup?car='+encodeURIComponent(c.plate),{cache:'no-store'});return await r.json()}catch(e){return null}},
  // n8n prices every order itself; the amount sent is only checked, never trusted
  async pay(kind,detail){
    if(!REAL){await wait(1100);return {ok:true,ref:'CF'+Date.now().toString().slice(-8)}}
    const c=car();
    const r=await fetch(N8N+'/wd-pay-order',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({amount:detail.amt,name:ACCT.name||'',phone:ME.phone10,car:c.name,num:c.plate,area:ACCT.area||'',kind,label:detail.what,
        planId:detail.planId,toPlan:detail.toPlan,fromPlan:detail.fromPlan,till:detail.till,service:detail.service,page:location.origin+location.pathname})});
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j||!j.paymentSessionId){const e=new Error((j&&j.message)||'order');e.server=!!(j&&j.message);throw e}
    const CF=await loadCashfree();
    const out=await CF({mode:CF_MODE}).checkout({paymentSessionId:j.paymentSessionId,redirectTarget:'_modal'});
    if(out&&out.error){const e=new Error(out.error.message||'payment');e.cancelled=/cancel/i.test(out.error.code||out.error.message||'');throw e}
    return {ok:true,ref:j.orderId||j.order_id||'',pending:true}},
  async bookOnDemand(c,svc,payRef){
    if(!REAL){await wait(500);ONDEMAND.unshift({service:svc.name,price:svc.price,paid:true,status:'new',date:iso(TODAY),car:c.name});return {ok:true}}
    const db=await realDb();if(!db)return {ok:false};
    try{const ref=await db.collection('ondemand').add({service:svc.name,service_id:svc.id,price:svc.price,paid:!!payRef,pay_ref:payRef||'',car:c.name,reg:c.plate,area:ACCT.area||'',phone:window.WDAuth.phone(),customer_id:window.WDAuth.phone(),status:'new',washer_id:'',created_at:nowIST(),date:iso(TODAY)});
      fetch(N8N+'/wd-ondemand-dispatch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({doc_id:ref.id,area:ACCT.area||''})}).catch(()=>{});
      return {ok:true}}
    catch(e){console.warn(e);return {ok:false}}},
};
let cfSdk=null;
function loadCashfree(){
  if(cfSdk)return cfSdk;
  cfSdk=new Promise((res,rej)=>{if(window.Cashfree)return res(window.Cashfree);
    const s=document.createElement('script');s.src='https://sdk.cashfree.com/js/v3/cashfree.js';
    s.onload=()=>window.Cashfree?res(window.Cashfree):rej(new Error('sdk'));s.onerror=()=>{cfSdk=null;rej(new Error('sdk'))};document.head.appendChild(s)});
  return cfSdk}

async function watchAccount(){
  const db=await realDb();
  if(!db){$('#main').innerHTML=`<div class="loading">Couldn't reach your account. Check your internet and reload.</div>`;return}
  if(acctUnsub){try{acctUnsub()}catch(e){}}
  let first=true;
  acctUnsub=db.doc('customers/'+window.WDAuth.phone()).onSnapshot(g=>{
    if(!g.exists){if(first){authStep.phone=ME.phone10;authStep.step='about';if(!$('#authCard'))showSignin();renderAuth()}first=false;return}
    const wasNew=ACCT&&ACCT.status!=='active';
    ACCT=fromCustomerDoc(g.data());carIdx=Math.min(carIdx,ACCT.cars.length-1);
    if(first){first=false;enterDash()}else{subscribe();renderDash()}
    if(wasNew&&ACCT.status==='active')toast("You're all set. Live wash updates are on.");
  },e=>{console.warn(e);$('#main').innerHTML=`<div class="loading">Couldn't open your account. Reload the page.</div>`});
}
function subscribe(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  if(!REAL){ACCT.cars.forEach(c=>{WASHES[c.id]=sampleWashes(c)});return}
  if(!DB)return;
  if(ACCT.status==='active')ACCT.cars.forEach(c=>{const id=c.id,reg=regOf(c);
    unsubs.push(DB.collection('washes').where('reg','==',reg).onSnapshot(snap=>{
      WASHES[id]=snap.docs.map(d=>fromContract(d.data())).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      if(car().id===id)renderDash()},()=>{}));
    unsubs.push(DB.collection('requests').where('reg','==',reg).onSnapshot(snap=>{REQS[id]=snap.docs.map(d=>d.data())},()=>{}));
  });
  ACCT.cars.forEach(c=>{const id=c.id;unsubs.push(DB.doc('carphotos/'+window.WDAuth.phone()+'_'+id).onSnapshot(g=>{
    const v=g.exists?safeImg(g.data().photo):null;if(v!==PHOTOS[id]){PHOTOS[id]=v;if(car().id===id)renderDash()}},()=>{}))});
  unsubs.push(DB.collection('ondemand').where('customer_id','==',window.WDAuth.phone()).onSnapshot(snap=>{
    ONDEMAND=snap.docs.map(d=>d.data()).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));renderDash()},()=>{}));
}

function weekCards(c){
  const mon=addDays(TODAY,-((TODAY.getDay()+6)%7)),pz=pausedOf(c);
  return Array.from({length:7},(_,i)=>{const d=addDays(mon,i),x=extras(c,d),off=pz&&iso(d)>=pz.from&&iso(d)<=pz.to,isT=iso(d)===iso(TODAY);
    return `<div class="day ${isT?'today':''} ${off?'off':''}"><span class="dn">${isT?'Today':fmt(d,{weekday:'short'})}</span><span class="dd">${fmt(d)}</span>
      ${off?'<span class="x base">Paused</span>':`<span class="x base">Pressure wash</span>${x.map(k=>`<span class="x">${LABEL[k]}</span>`).join('')}`}</div>`}).join('')}

function historyCard(c){
  const list=(WASHES[c.id]||[]).filter(d=>d.date<=iso(TODAY)).slice(0,14);
  return `<div class="chead"><div><span class="kick">History</span><h2>Recent <b>washes</b></h2></div></div>
    ${list.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Washer</th><th>Done</th><th>Time</th><th>Status</th></tr></thead><tbody>
    ${list.map(d=>{const n=d.tasks.filter(t=>t.done);return `<tr><td>${fmt(d.date,{weekday:'short',day:'numeric',month:'short'})}</td><td>${esc(d.washer&&d.washer.name||c.washer)}</td>
      <td>${d.status==='skipped'?'—':n.map(t=>esc(t.label.replace(' cleaning','').replace(' polish','').replace('Dried by hand','Dry'))).join(', ')||'—'}</td>
      <td class="num">${d.finished_at?ampm(d.finished_at):d.started_at?ampm(d.started_at):'—'}${d.minutes?` · ${d.minutes} min`:''}</td>
      <td>${d.status==='done'?'<span class="pill ok">Done</span>':d.status==='skipped'?`<span class="pill skip" title="${esc(d.skip_reason)}">Skipped</span>`:`<span class="pill go">${STAGE_LABEL[STAGES.indexOf(d.status)]||'Booked'}</span>`}</td></tr>`}).join('')}
    </tbody></table></div>`:`<div class="empty">${c.status==='new'?'Your washes will show up here from the first morning.':'No washes recorded yet.'}</div>`}`}

function usageCard(c,p){
  const ym=iso(TODAY).slice(0,7),list=(WASHES[c.id]||[]).filter(d=>String(d.date).startsWith(ym)&&d.status==='done');
  const n={interior:0,foam:0,tyre:0,detailing:0};list.forEach(d=>d.tasks.forEach(t=>{if(t.done&&n[t.key]!==undefined)n[t.key]++}));
  const dim=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate(),wk=dim/7,f=p.f;
  const cap={interior:Math.round(f.int*wk),foam:Math.round(f.foam*wk),tyre:Math.round(f.tyre*wk),detailing:f.det};
  const rows=[['interior','Interior'],['foam','Foam wash'],['tyre','Tyre & trim'],['detailing','Detailing']].filter(([k])=>cap[k]>0);
  return `<span class="kick">${fmt(TODAY,{month:'long'})}</span><h2>This <b>month</b></h2>
    <div class="big num">${list.length}<small> washes so far</small></div>
    <div class="bars">${rows.map(([k,l])=>`<div class="bar"><div class="bt"><span>${l}</span><span class="num">${n[k]} of ${cap[k]}</span></div><div class="tr"><i style="width:${Math.min(100,n[k]/cap[k]*100)}%"></i></div></div>`).join('')}</div>`}

function carCard(c){
  const pic=PHOTOS[c.id];
  return `<span class="kick">Your car</span><h2>${esc(c.make?c.make+' ':'')}<b>${esc(c.name)}</b></h2>
    ${pic?`<img class="carpic" src="${esc(pic)}" alt="Your ${esc(c.name)}">`:''}
    <dl><dt>Number</dt><dd><span class="plate">${esc(c.plate)}</span></dd><dt>Parking</dt><dd>${esc(c.parking||'—')}</dd><dt>Washer</dt><dd>${esc(c.washer)}</dd>
      <dt>Wash time</dt><dd>${esc(c.window||'Before 7:30 AM')}</dd><dt>Keys</dt><dd>${esc(c.keys||'—')}</dd><dt>Status</dt><dd>${c.status==='new'?'<span class="pill go">Being checked</span>':'<span class="pill ok">Active</span>'}</dd></dl>
    ${(ACCT.requested||[]).length?`<p class="sub" style="margin-top:16px">Waiting to be added: ${ACCT.requested.map(r=>esc(r.name+' · '+r.plate)).join(', ')}</p>`:''}
    <button class="btn ghost" style="margin-top:20px" data-act="addCar">${ICON.plus} Add another car</button>`}

function onDemandCard(){
  const list=ONDEMAND.slice(0,6);
  return `<div class="chead"><div><span class="kick">On-demand</span><h2>Extra <b>washes</b></h2><p class="sub">A washer comes in 45–60 minutes, wherever your car is parked.</p></div></div>
    ${list.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Wash</th><th>Price</th><th>Status</th></tr></thead><tbody>${list.map(o=>`<tr><td>${o.date?fmt(o.date):'—'}</td><td>${esc(o.service)}${o.car?`<br><small style="color:var(--muted)">${esc(o.car)}</small>`:''}</td><td class="num">${inr(+o.price||0)}${o.paid?'':' <small>(on arrival)</small>'}</td><td>${o.status==='done'?'<span class="pill ok">Done</span>':o.status==='doing'?'<span class="pill go">Washing</span>':'<span class="pill go">Washer coming</span>'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No on-demand washes yet.</div>`}
    <button class="btn violet" style="margin-top:20px" data-act="book">Book a wash · from ${inr(199)}</button>`}

/* =====================================================================
   ACTIONS (modals)
   ===================================================================== */
const scrim=$('#scrim'),modal=$('#modal');
function openModal(html,after){modal.innerHTML=`<button class="x" type="button" aria-label="Close" data-close>×</button>`+html;scrim.classList.add('on');modal.querySelector('[data-close]').onclick=closeModal;after&&after();setTimeout(()=>{const f=modal.querySelector('input,textarea,.btn:not(.x)');f&&f.focus()},60)}
function closeModal(){scrim.classList.remove('on')}
scrim.addEventListener('click',e=>{if(e.target===scrim)closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&scrim.classList.contains('on'))closeModal()});
function doneModal(title,text){openModal(`<div class="done"><div class="tick"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1A0A33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div><h3 id="mTitle" style="padding:0">${title}</h3><p class="sub">${text}</p><button class="btn violet" style="margin-top:20px" data-close2>Done</button></div>`,()=>{modal.querySelector('[data-close2]').onclick=closeModal})}
const failed=()=>toast("That didn't go through. Call or WhatsApp us on 77018 08924.");
async function checkout(btn,kind,amt,what,detail,onPaid){
  const done=busy(btn,'Opening payment…');
  try{const r=await API.pay(kind,Object.assign({amt,what},detail));onPaid(r)}
  catch(e){done();toast(e&&e.cancelled?'Payment cancelled. Nothing was charged.':e&&e.server?e.message+' Nothing was charged.':"Payment didn't go through. Nothing was charged.")}}
const SAFE=`<p class="safe">🔒 Secure payment by Cashfree · UPI, cards, net banking${REAL?'':'<br>Preview: no money moves.'}</p>`;

const ACT={
  payPlan(){const c=car(),p=planOf(c),b=BILL[c.id],amt=b&&b.due?b.due:p.price,from=c.till&&parse(c.till)>TODAY?parse(c.till):TODAY,nt=new Date(from);nt.setMonth(nt.getMonth()+1);
    openModal(`<h3 id="mTitle">Pay ${inr(amt)}</h3><p class="sub">${esc(c.name)} · ${p.name}${b&&b.owes>0?' · what you owe now':''}</p>
      <div class="swap"><div><small>${c.till?'Paid up till':'Starts'}</small><b>${fmt(c.till||TODAY)}</b></div><span>→</span><div class="to"><small>After paying</small><b>${fmt(nt)}</b></div></div>
      <button class="btn violet wide" id="go">Pay ${inr(amt)}</button>${SAFE}`,()=>{
      $('#go').onclick=e=>checkout(e.currentTarget,'plan',amt,`${p.name} · ${c.name}`,{planId:p.id},r=>{
        if(REAL){const was=c.till||'';doneModal('Payment received',"We're confirming it with the bank. Your paid-up date updates here by itself in a few seconds.");pollPaidTo(c,was)}
        else{c.till=iso(nt);renderDash();doneModal('Paid',`Your ${esc(c.name)} is covered till ${fmt(nt)}. Receipt sent on WhatsApp.`)}})})},
  seePlans(){document.querySelector('.compare').scrollIntoView({behavior:'smooth',block:'center'})},
  switch(id){const c=car(),cp=planOf(c),np=PLANS.find(x=>x.id===id),left=c.till?Math.max(0,Math.round((parse(c.till)-TODAY)/864e5)):0,diff=Math.max(0,Math.round((np.price-cp.price)*left/30)),up=np.price>cp.price;
    openModal(`<h3 id="mTitle">${up?'Upgrade':'Switch'} to ${np.name}</h3><p class="sub">${esc(c.name)}</p>
      <div class="swap"><div><small>Now</small><b>${cp.name}</b><br><span class="num">${inr(cp.price)}/mo</span></div><span>→</span><div class="to"><small>From tomorrow</small><b>${np.name}</b><br><span class="num">${inr(np.price)}/mo</span></div></div>
      <p class="sub">${up&&diff?`You pay ${inr(diff)} today for the ${left} days left in your month. After that it's ${inr(np.price)} a month.`:up?'Nothing to pay today. The new price starts with your next payment.':`No charge today. We'll switch you over and the new price starts from your next payment.`}</p>
      <button class="btn violet wide" id="go" style="margin-top:18px">${up&&diff?'Pay '+inr(diff)+' and upgrade':'Ask for '+np.name}</button>${up&&diff?SAFE:''}`,()=>{
      $('#go').onclick=async e=>{
        const fin=async()=>{await API.request({reg:regOf(c),kind:'note',text:`Plan change: ${cp.name} to ${np.name}${up&&diff?' (difference paid online)':''}`});
          if(!REAL){c.plan=id;renderDash()}
          doneModal(up&&diff?'Upgraded':'Request sent',up&&diff?`From tomorrow ${esc(c.washer)} follows the ${np.name} checklist for your ${esc(c.name)}.`:`We'll move your ${esc(c.name)} to ${np.name} and confirm on WhatsApp.`)};
        if(up&&diff)checkout(e.currentTarget,'upgrade',diff,`Upgrade to ${np.name} · ${c.name}`,{toPlan:np.id,fromPlan:cp.id,till:c.till||''},fin);
        else{const undo=busy(e.currentTarget,'Sending…');try{await fin()}catch(x){undo();failed()}}}})},
  book(){const c=car();let svc=SVCS[0];
    openModal(`<h3 id="mTitle">Book a wash</h3><p class="sub">For your ${esc(c.name)} · <span class="num">${esc(c.plate)}</span>. A washer arrives in 45–60 minutes.</p>
      ${SVCS.map((s,i)=>`<button type="button" class="opt ${i?'':'on'}" data-v="${s.id}"><span class="rd"></span><span><b>${s.name}</b><small>${s.d}</small></span><span class="p num">${inr(s.price)}</span></button>`).join('')}
      <button class="btn violet wide" id="go" style="margin-top:18px">Pay ${inr(svc.price)}</button>${SAFE}`,()=>{
      $$('.modal .opt').forEach(b=>b.onclick=()=>{svc=SVCS.find(s=>s.id===b.dataset.v);$$('.modal .opt').forEach(x=>x.classList.toggle('on',x===b));$('#go').textContent='Pay '+inr(svc.price)});
      $('#go').onclick=e=>checkout(e.currentTarget,'onetime',svc.price,`${svc.name} · ${c.name}`,{service:svc.id},async r=>{
        const b=await API.bookOnDemand(c,svc,r.ref||'paid');renderDash();
        doneModal('Booked',b.ok?`${esc(svc.name)} is booked and paid. A washer is on the way within the hour. We'll call when he's close.`:`We have your payment. We'll call you to send a washer.`)})})},
  tip(){const c=car();let amt=50;
    openModal(`<h3 id="mTitle">Tip ${esc(c.washer)}</h3><p class="sub">All of it goes to him, the same day.</p>
      <div class="picks" id="tips" style="margin-top:18px">${[20,50,100,200].map(n=>`<button type="button" class="${n===50?'on':''}" data-v="${n}">${inr(n)}</button>`).join('')}</div>
      <button class="btn wide" id="go" style="margin-top:18px">Send ${inr(amt)}</button>${SAFE}`,()=>{
      $$('#tips button').forEach(b=>b.onclick=()=>{amt=+b.dataset.v;$$('#tips button').forEach(x=>x.classList.toggle('on',x===b));$('#go').textContent='Send '+inr(amt)});
      $('#go').onclick=e=>checkout(e.currentTarget,'tip',amt,`Tip for ${c.washer}`,{},()=>doneModal('Sent',`${esc(c.washer)} gets ${inr(amt)} and a thank-you from you on WhatsApp.`))})},
  note(){const c=car();
    openModal(`<h3 id="mTitle">Note for ${esc(c.washer)}</h3><p class="sub">He sees it on tomorrow's round.</p>
      <label class="lbl" for="nt">Your note</label><textarea id="nt" class="field" rows="4" maxlength="1000" style="resize:vertical" placeholder="e.g. Please do the boot area too"></textarea>
      <div class="picks" id="quick" style="margin-top:12px">${['Car is in the basement','Skip tomorrow','Extra interior please','Clean the boot'].map(t=>`<button type="button">${t}</button>`).join('')}</div>
      <button class="btn violet wide" id="go" style="margin-top:18px">Send to ${esc(c.washer)}</button>`,()=>{
      $$('#quick button').forEach(b=>b.onclick=()=>{const t=$('#nt');t.value=(t.value?t.value.trim()+'. ':'')+b.textContent;t.focus()});
      $('#go').onclick=async e=>{const v=$('#nt').value.trim();if(!v){$('#nt').focus();return}const undo=busy(e.currentTarget,'Sending…');
        const r=await API.request({reg:regOf(c),kind:'note',text:v});if(!r.ok){undo();return failed()}closeModal();toast('Note sent to '+c.washer)}})},
  issue(){const c=car();const spots=['Roof','Windows','Wheels','Interior','Mats','Dashboard','Boot','Bumpers'],on=new Set();
    openModal(`<h3 id="mTitle">Something missed?</h3><p class="sub">Pick what needs another go. ${esc(c.washer)} re-washes it on his next round.</p>
      <div class="picks" id="sp" style="margin-top:18px">${spots.map(s=>`<button type="button">${s}</button>`).join('')}</div>
      <button class="btn violet wide" id="go" style="margin-top:18px" disabled>Ask for a re-wash</button>`,()=>{
      $$('#sp button').forEach(b=>b.onclick=()=>{const t=b.textContent;on.has(t)?on.delete(t):on.add(t);b.classList.toggle('on');$('#go').disabled=!on.size});
      $('#go').onclick=async e=>{const undo=busy(e.currentTarget,'Sending…');const list=[...on];
        const r=await API.request({reg:regOf(c),kind:'rewash',spots:list,text:'Re-wash: '+list.join(', ')});if(!r.ok){undo();return failed()}
        doneModal('Sent',`${esc(c.washer)} will re-do ${esc(list.join(', ').toLowerCase())} on his next round.`)}})},
  pause(){const c=car();
    if(c.status==='new'){toast('You can pause once your washes have started');return}
    if(!PAUSE_PLANS.includes(c.plan)){openModal(`<h3 id="mTitle">Pausing comes with WD Pro</h3><p class="sub">On WD Pro and above you can pause up to ${PAUSE_MAX} days a month, on any days you like. The days are added to the end of your plan. Your ${esc(c.name)} is on ${planOf(c).name}.</p><button class="btn violet wide" style="margin-top:20px" id="go">See plans</button>`,()=>{$('#go').onclick=()=>{closeModal();ACT.seePlans()}});return}
    if(pausedOf(c)){toast(`Already paused till ${fmt(pausedOf(c).to)}. Resume it first.`);return}
    const min=iso(addDays(TODAY,1)),max=iso(addDays(TODAY,30));
    openModal(`<h3 id="mTitle">Pause washes</h3><p class="sub">Up to ${PAUSE_MAX} days a month. ${esc(c.washer)} skips your car and the days are added to your plan.</p>
      <label class="lbl" for="pzFrom">Starting</label><input type="date" class="field" id="pzFrom" min="${min}" max="${max}" value="${min}">
      <span class="lbl">For</span><div class="picks" id="pzN">${[1,2,3,4,5,6,7].map(n=>`<button type="button" class="${n===1?'on':''}" data-v="${n}">${n} day${n>1?'s':''}</button>`).join('')}</div>
      <div class="swap" id="pzSum"></div>
      <button class="btn violet wide" id="go">Pause washes</button>`,()=>{
      let days=1;const draw=()=>{const f=$('#pzFrom').value||min,to=iso(addDays(parse(f),days-1));$('#pzSum').innerHTML=`<div><small>No washes</small><b>${days===1?fmt(f):fmt(f)+' – '+fmt(to)}</b></div>`};
      $$('#pzN button').forEach(b=>b.onclick=()=>{days=+b.dataset.v;$$('#pzN button').forEach(x=>x.classList.toggle('on',x===b));draw()});$('#pzFrom').oninput=draw;draw();
      $('#go').onclick=async e=>{const f=$('#pzFrom').value;if(!f||f<min||f>max){toast('Pick a start date within the next 30 days');return}
        const to=iso(addDays(parse(f),days-1)),undo=busy(e.currentTarget,'Telling '+c.washer+'…');
        const r=await API.request({reg:regOf(c),kind:f===min&&days===1?'skip_tomorrow':'pause',from:f,to,text:`Paused ${f} to ${to}`});if(!r.ok){undo();return failed()}
        local.paused=local.paused||{};local.paused[ACCT.phone+'_'+regOf(c)]={from:f,to};saveLocal();renderDash();
        doneModal('Paused',`No washes ${days===1?'on '+fmt(f):fmt(f)+' – '+fmt(to)}. ${esc(c.washer)} has been told.`)}})},
  async resume(){const c=car();const r=await API.request({reg:regOf(c),kind:'pause',from:null,to:null,text:'Resumed'});if(!r.ok)return failed();
    delete local.paused[ACCT.phone+'_'+regOf(c)];saveLocal();renderDash();toast(`Washes resume tomorrow. ${c.washer} has been told.`)},
  async rate(n){const c=car();n=+n;local.rated=local.rated||{};local.rated[iso(TODAY)+'_'+regOf(c)]=n;saveLocal();renderDash();
    await API.rate(c,n);toast(n>=4?`${c.washer} will see your ${n} stars`:'Sorry about that. Tell us what was missed.');if(n<=3)setTimeout(()=>ACT.issue(),500)},
  addCar(){const c=car();
    openModal(`<h3 id="mTitle">Add another car</h3><p class="sub">We check the spot and add it to your account, usually within a day.</p>
      <label class="lbl" for="acM">Car</label><input class="field" id="acM" placeholder="e.g. Creta, Nexon, City">
      <label class="lbl" for="acP">Registration number</label><input class="field" id="acP" placeholder="DL 8C AB 1234" style="text-transform:uppercase">
      <span class="lbl">Plan</span><div class="picks" id="acPl">${PLANS.filter(p=>!p.old).map(p=>`<button type="button" class="${p.id==='pro'?'on':''}" data-v="${p.id}">${p.name.replace('WD ','')} · ${inr(p.price)}</button>`).join('')}</div>
      <div class="err" id="acErr"></div><button class="btn violet wide" id="go">Add car</button>`,()=>{
      let plan='pro';$$('#acPl button').forEach(b=>b.onclick=()=>{plan=b.dataset.v;$$('#acPl button').forEach(x=>x.classList.toggle('on',x===b))});
      $('#go').onclick=async e=>{const m=$('#acM').value.trim(),pl=$('#acP').value.trim().toUpperCase();
        if(!m||!/^[A-Z0-9 ]{4,14}$/.test(pl)){$('#acErr').textContent='Add the car and its registration number.';return}
        const undo=busy(e.currentTarget,'Sending…');const r=await API.addCar({name:m,make:'',plate:pl,plan,area:ACCT.area});if(!r.ok){undo();return failed()}
        if(!REAL){ACCT.requested.push({name:m,plate:pl});renderDash()}
        doneModal('Request sent',`We'll check where your ${esc(m)} is parked and add it to your account.`)}})},
};
function wire(){
  $$('#main [data-act]').forEach(b=>b.onclick=e=>{e.preventDefault();const f=ACT[b.dataset.act];f&&f(b.dataset.v)});
  $$('#main [data-car]').forEach(b=>b.onclick=()=>{carIdx=+b.dataset.car;renderDash()});
}
$('#signOut').onclick=signOut;

/* ---------- start ---------- */
async function boot(){
  if(REAL){
    const u=await window.WDAuth.ready();
    if(u&&window.WDAuth.phone10()){ME={phone10:window.WDAuth.phone10()};authStep.phone=ME.phone10;await watchAccount()}
    else showSignin();
    return}
  const dm=local.demo;
  if(dm&&dm.phone){ME={phone10:dm.phone};ACCT=dm.acct||sampleAccount();enterDash()}else showSignin()}
boot();
</script>
