<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5409DA">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Opening payment — Washing Daddy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600;700&display=swap">
<style>
:root{--violet:#5409DA;--gold:#FFBA08;--cream:#FFF6E9;--ink:#1A0A33;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--violet);color:var(--cream);font-family:'Poppins',system-ui,sans-serif;text-align:center;padding:24px}
main{max-width:360px}
h1{margin:0 0 8px;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:.02em;color:var(--gold)}
p{margin:0 0 20px;line-height:1.5;opacity:.92}
.spin{width:36px;height:36px;margin:0 auto 20px;border-radius:50%;border:4px solid rgba(255,246,233,.25);border-top-color:var(--gold);animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
a{display:inline-block;min-height:48px;line-height:48px;padding:0 24px;border-radius:14px;background:var(--gold);color:var(--ink);font-weight:700;text-decoration:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="spin" id="spin"></div>
  <h1 id="h">Opening payment</h1>
  <p id="m">One moment. You will pay on Cashfree's secure page.</p>
  <a id="back" href="https://washingdaddy.com/" hidden>Back to Washing Daddy</a>
</main>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<script>
(function () {
  var s = new URLSearchParams(location.search).get("s") || "";
  function fail(msg) {
    document.getElementById("spin").hidden = true;
    document.getElementById("h").textContent = "Couldn't open payment";
    document.getElementById("m").textContent = msg;
    document.getElementById("back").hidden = false;
  }
  /* Cashfree payment session ids are long url-safe tokens */
  if (!/^[A-Za-z0-9_\-]{20,400}$/.test(s)) return fail("This payment link is not valid. Go back to the app and try again. Nothing was charged.");
  if (!window.Cashfree) return fail("Couldn't load the payment page. Check your internet and try again. Nothing was charged.");
  try {
    /* After paying, Cashfree sends the customer to the fixed return page chosen by our server:
       https://washingdaddy.com/pay/?order_id=... which shows the result. */
    window.Cashfree({ mode: "production" }).checkout({ paymentSessionId: s, redirectTarget: "_self" });
  } catch (e) { fail("Couldn't open the payment. Go back to the app and try again. Nothing was charged."); }
})();
</script>
</body>
</html>
