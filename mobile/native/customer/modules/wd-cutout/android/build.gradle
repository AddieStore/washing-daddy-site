plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.washingdaddy.wdcutout'
version = '1.0.0'

android {
  namespace "expo.modules.wdcutout"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // unbundled: the model is fetched by Google Play services (see the DEPENDENCIES meta-data in AndroidManifest.xml)
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
