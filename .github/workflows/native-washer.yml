name: Native washer app (Expo)

# Checks the Expo / React Native rewrite of WD Partner in mobile/native/washer.
# The native build is unsigned; signing is done outside CI with the Washing Daddy release key, like today.
on:
  push:
    paths:
      - 'mobile/native/washer/**'
      - '.github/workflows/native-washer.yml'
  pull_request:
    paths:
      - 'mobile/native/washer/**'
      - '.github/workflows/native-washer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-washer-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile/native/washer

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/native/washer/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Web export
        run: npx expo export -p web
        env:
          EXPO_OFFLINE: '1'

  android:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the APK back to the branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit below may need rebasing onto a branch that moved

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/native/washer/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      # firebase/google-services.json is committed and used as is
      - name: Prebuild
        run: npx expo prebuild -p android --no-install
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
          WD_RELEASE: '1'   # app.config.ts refuses to build a demo app

      # The release APK is signed with Expo's default debug keystore; we re-sign it with the
      # Washing Daddy release key outside CI (tools/sign-apk.sh).
      - name: Build release APK
        working-directory: mobile/native/washer/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/wd-partner-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wd-partner-android-unsigned
          path: mobile/native/washer/out/wd-partner-unsigned.apk
          if-no-files-found: error

      - name: Commit APK back to the branch
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f mobile/native/washer/out/wd-partner-unsigned.apk
          git diff --staged --quiet && exit 0
          # [skip ci] in the message stops this push from triggering workflows again
          git commit -m "Build WD Partner native APK [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push rejected, retrying (try $i)"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
