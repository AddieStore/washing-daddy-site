name: Native washer app (Expo)

# Checks the Expo / React Native rewrite of WD Partner in mobile/native/washer.
# The native build is unsigned; signing is done outside CI with the Washing Daddy release key, like today.
on:
  push:
    paths:
      - 'mobile/native/washer/**'
      - '.github/workflows/native-washer.yml'
  pull_request:
    paths:
      - 'mobile/native/washer/**'
      - '.github/workflows/native-washer.yml'
  workflow_dispatch:
    inputs:
      demo:
        description: 'Build a demo APK (sample 10-car route, OTP 1234, no Firebase sign-in) for looking at the screens on a phone. Not for release.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-washer-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile/native/washer

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/native/washer/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Web export
        run: npx expo export -p web
        env:
          EXPO_OFFLINE: '1'

  android:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the APK back to the branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit below may need rebasing onto a branch that moved

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/native/washer/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      # firebase/google-services.json is committed and used as is
      - name: Prebuild
        run: npx expo prebuild -p android --no-install
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
          WD_RELEASE: ${{ inputs.demo && '0' || '1' }}   # app.config.ts refuses to build a demo app

      # The release APK is signed with Expo's default debug keystore; we re-sign it with the
      # Washing Daddy release key outside CI (tools/sign-apk.sh).
      - name: Build release APK
        working-directory: mobile/native/washer/android
        env:
          EXPO_PUBLIC_DEMO: ${{ inputs.demo && '1' || '' }}   # demo build: the JS bundle is made here
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      # when the build fails, keep the end of the log in the repo so it can be read without GitHub's log viewer
      - name: Save build error
        if: failure()
        working-directory: .
        run: |
          mkdir -p mobile/native/washer/out
          grep -n -i -E "error|FAILED|What went wrong|Caused by|Execution failed" mobile/native/washer/gradle-build.log | head -60 > mobile/native/washer/out/gradle-error.txt || true
          tail -n 120 mobile/native/washer/gradle-build.log >> mobile/native/washer/out/gradle-error.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f mobile/native/washer/out/gradle-error.txt
          git commit -m "WD Partner native build error log [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" || true

      # Play Store upload file. Like the APK it carries Expo's debug signature: strip META-INF/ANDROIDD.* and
      # sign it with jarsigner and the release key before uploading (see mobile/store/play-release-customer.md).
      - name: Build Play bundle
        if: ${{ !inputs.demo }}
        working-directory: mobile/native/washer/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/wd-partner-unsigned.apk
          [ -f android/app/build/outputs/bundle/release/app-release.aab ] && cp android/app/build/outputs/bundle/release/app-release.aab out/wd-partner-unsigned.aab || true
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wd-partner-android-unsigned${{ inputs.demo && '-demo' || '' }}
          path: |
            mobile/native/washer/out/wd-partner-unsigned.apk
            mobile/native/washer/out/wd-partner-unsigned.aab
          if-no-files-found: error

      - name: Commit APK back to the branch
        if: ${{ !inputs.demo && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # the raw APK is over GitHub's 100 MB file limit, so the branch gets a compressed copy (gunzip it before signing)
          gzip -9 -c mobile/native/washer/out/wd-partner-unsigned.apk > mobile/native/washer/out/wd-partner-unsigned.apk.gz
          git add -f mobile/native/washer/out/wd-partner-unsigned.apk.gz
          # the bundle goes in as is when it fits under GitHub's 100 MB limit, else gzipped
          if [ "$(stat -c %s mobile/native/washer/out/wd-partner-unsigned.aab)" -lt 95000000 ]; then
            git add -f mobile/native/washer/out/wd-partner-unsigned.aab
          else
            gzip -9 -c mobile/native/washer/out/wd-partner-unsigned.aab > mobile/native/washer/out/wd-partner-unsigned.aab.gz
            git add -f mobile/native/washer/out/wd-partner-unsigned.aab.gz
          fi
          git diff --staged --quiet && exit 0
          # [skip ci] in the message stops this push from triggering workflows again
          git commit -m "Build WD Partner native APK [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push rejected, retrying (try $i)"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
