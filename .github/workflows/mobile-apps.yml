name: Build customer and washer APKs

# Builds both new apps from /customer and /washer, installs them on an Android emulator,
# and commits the APKs (plus launch screenshots) back to the branch.
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'customer/**'
      - 'washer/**'
      - 'mobile/android/**'
      - '.github/workflows/mobile-apps.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle the web apps into the APKs
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties
          for app in customer washer; do
            rm -rf mobile/android/app/src/$app/assets/www
            mkdir -p mobile/android/app/src/$app/assets
            cp -r $app mobile/android/app/src/$app/assets/www
          done

      - name: Build
        working-directory: mobile/android
        run: gradle assembleCustomerDebug assembleWasherDebug --no-daemon --stacktrace

      - name: Collect
        run: |
          mkdir -p apks
          cp mobile/android/app/build/outputs/apk/customer/debug/app-customer-debug.apk apks/washing-daddy-customer.apk
          cp mobile/android/app/build/outputs/apk/washer/debug/app-washer-debug.apk apks/wd-washer.apk
          ls -lh apks

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open both apps on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          ram-size: 4096M
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/android/ci/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-screens
          path: ci-screens/
      - name: Keep the screenshots on a side branch (readable without artifact downloads)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-screens-tmp && git rm -rq --cached . && git add -f ci-screens
          git commit -qm "Emulator screenshots for ${GITHUB_SHA::7} [skip ci]" && git push -f origin HEAD:refs/heads/ci/emulator-screens || true

  publish:
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: app
      - uses: actions/download-artifact@v4
        with:
          name: ci-screens
          path: mobile/android/ci-screens
      - name: Commit the APKs to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/washing-daddy-customer.apk app/wd-washer.apk mobile/android/ci-screens
          git diff --staged --quiet || git commit -m "Build customer and washer APKs [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
